# Scanbot
# 1. Put your Discord bot token in ./data/token.txt (or set DISCORD_TOKEN in .env)
# 2. docker compose up -d
# Logs: docker compose logs -f scanbot

services:
  scanbot:
    image: ${SCANBOT_IMAGE:-ghcr.io/thedyxer/scanbot:latest}
    restart: unless-stopped
    # Run as the owner of ./data so the bot can read token.txt (the installer sets these in .env)
    user: "${SCANBOT_UID:-1000}:${SCANBOT_GID:-1000}"
    # When stopped or updated, the bot stops running scans and posts what they found so far.
    # Docker waits this long for that before killing it (without this line, 10 seconds or less).
    stop_grace_period: 45s
    init: true  # Docker's tiny init runs as PID 1 and passes the stop signal on to the bot
    # Every ping in flight holds a socket (see DIRECT_CONCURRENCY below)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      # Set SLASH_ONLY=1 in .env to run without the Message Content intent (slash commands only)
      SLASH_ONLY: ${SLASH_ONLY:-}
      # auto (default): Quad9 over TLS, or over HTTPS if port 853 is blocked. dot or doh: use only that one
      DNS_TRANSPORT: ${DNS_TRANSPORT:-}
      # Time zone of the times in the bot's log (TZ in .env, default UTC)
      TZ: ${TZ:-UTC}
      # Scan limits and speed: set these in .env (README, "Configuration"). Empty means the default.
      MAX_IPS_PER_SCAN: ${MAX_IPS_PER_SCAN:-}
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-}
      DIRECT_CONCURRENCY: ${DIRECT_CONCURRENCY:-}
      DIRECT_CONCURRENCY_TOTAL: ${DIRECT_CONCURRENCY_TOTAL:-}
      DIRECT_TIMEOUT: ${DIRECT_TIMEOUT:-}
      API_DELAY: ${API_DELAY:-}
      GEO_DELAY: ${GEO_DELAY:-}
      PROGRESS_INTERVAL: ${PROGRESS_INTERVAL:-}
      GEO_DB_MAX_AGE_DAYS: ${GEO_DB_MAX_AGE_DAYS:-}
      DIRECT_RECHECK: ${DIRECT_RECHECK:-}
    volumes:
      - ./data:/data:ro
    labels:
      # Picked up by the watchtower service below, or by a Watchtower you already run
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: scanbot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Automatic updates: checks for a new scanbot image daily at 4 AM (TZ in .env, default UTC)
  # and only ever touches scanbot. Already run Watchtower on this host? Delete this block;
  # the labels above let your existing one update scanbot instead. The installer keeps it
  # deleted when it updates this file. Keep this block last.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --scope scanbot --label-enable --include-restarting --cleanup --schedule "0 0 4 * * *"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.scope: scanbot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
