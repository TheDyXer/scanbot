# VPN for scanbot's server pings. gluetun is a VPN client container; the pinger runs inside it and
# sends every ping to the servers you scan. The bot itself stays on this machine's connection for
# Discord, mcstatus.io, ip-api.com and DNS: their limits count per address, and VPN addresses are shared.
# If the VPN drops, pings stop (they never use your own connection) and scans use the API until it's back.
# With Mullvad server switching, the bot reconnects and switches servers itself, so vpn.env also has
# HEALTH_RESTART_VPN=off (gluetun v3.41.3 restarts in a loop otherwise: qdm12/gluetun#3485).
#
# The installer sets this up and replaces this file on every run (curl ... | bash -s -- --vpn).
# By hand: put gluetun's settings in vpn.env next to this file (see README, "VPN"), then add this
# line to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml

services:
  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: vpn.env
    environment:
      TZ: ${TZ:-UTC}
      DNS_UPSTREAM_RESOLVERS: quad9
      # The bot asks gluetun's control server to change Mullvad servers every few minutes
      HTTP_CONTROL_SERVER_LOG: "off"
    # Never publish the pinger's port (8765) or gluetun's control server (8000) here:
    # that would let anyone on your network use them
    volumes:
      # gluetun keeps its VPN server list here. With Mullvad, vpn/auth/config.toml (made by the
      # installer) lets the bot switch servers with GLUETUN_API_KEY, and nothing else.
      - ./vpn:/gluetun
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: scanbot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Pings servers for the bot, from inside the VPN. It only accepts public IP addresses, and only
  # the containers in this compose project can reach it (at gluetun:8765).
  pinger:
    image: ${SCANBOT_IMAGE:-ghcr.io/thedyxer/scanbot:latest}
    restart: unless-stopped
    command: ["python", "/app/pinger.py"]
    network_mode: service:gluetun
    user: "${SCANBOT_UID:-1000}:${SCANBOT_GID:-1000}"
    # Every ping in flight holds two sockets: the bot's request and the connection to the server
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Started as soon as gluetun runs, not only once the VPN is up: otherwise a VPN that doesn't
    # connect at first leaves the pinger never started. Nothing leaks meanwhile: gluetun's firewall
    # blocks all traffic but the VPN's until the VPN is up.
    depends_on:
      gluetun:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: scanbot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  scanbot:
    environment:
      # Pings go to the pinger in the VPN; everything else uses this machine's connection
      PINGER_URL: http://gluetun:8765
      # Set by the installer
      VPN_PROVIDER: ${VPN_PROVIDER:-}
      VPN_LOCATION: ${VPN_LOCATION:-}
      # Mullvad only: switch to another server when the current one is down
      GLUETUN_URL: http://gluetun:8000
      GLUETUN_API_KEY: ${GLUETUN_API_KEY:-}
      VPN_FALLBACK_CITIES: ${VPN_FALLBACK_CITIES:-}
